name: Renovate

on:
  schedule:
    # 00:00 UTC Monday == 03:00 Europe/Sofia (summer) / 02:00 (winter).
    # renovate.json's own `schedule` is what actually gates PR creation.
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        required: false
        default: info
        type: choice
        options: [info, debug]
      dryRun:
        description: Dry run (report only, open no PRs)
        required: false
        default: false
        type: boolean

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # Self-hosted ARC scale set for this repo.
    runs-on: gh-runner-image-runner
    steps:
      # Renovate is baked into the runner image (npm, ~360MB) rather than
      # pulled as a container per job: the image is cached by kubelet per node,
      # while the dind sidecar has no persistent /var/lib/docker. No checkout
      # step - Renovate clones the repo itself.
      - name: Run Renovate
        env:
          # Renovate holds whole registry payloads in memory (bitnami's helm
          # index.yaml is ~26MB of YAML). Node's default heap is ~half the
          # container limit, which OOM-killed it. Scoped to this step so other
          # Actions keep the default.
          NODE_OPTIONS: --max-old-space-size=3072
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          # Without this Renovate falls back to renovate@whitesourcesoftware.com,
          # a Mend-owned account with Vigilant Mode on, which flags every commit
          # as Unverified.
          RENOVATE_GIT_AUTHOR: 'jimytar <182091400+jimytar@users.noreply.github.com>'
          # github-releases/npm lookups are rate-limited without this.
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || 'null' }}
        run: renovate
